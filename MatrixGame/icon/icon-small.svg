<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32">
  <!-- The same for 16-48 px: the globe of icon.png redrawn with fewer, thicker lines on a white ball (its thin wires
       fade out when scaled down), the sight drawn thicker. -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#b8150a" stroke-width="5"/>
  <g fill="#b8150a">
    <rect x="28" y="1" width="8" height="12"/>
    <rect x="28" y="51" width="8" height="12"/>
    <rect x="1" y="28" width="12" height="8"/>
    <rect x="51" y="28" width="12" height="8"/>
  </g>
  <circle cx="32" cy="32" r="18" fill="#ffffff"/>
  <g transform="rotate(32 32 32)" fill="none" stroke="#2b3dff" stroke-width="2.2">
    <ellipse cx="32" cy="32" rx="7" ry="18"/>
    <ellipse cx="32" cy="32" rx="13.5" ry="18"/>
    <line x1="32" y1="14" x2="32" y2="50"/>
    <line x1="14" y1="32" x2="50" y2="32"/>
    <line x1="16.4" y1="23" x2="47.6" y2="23"/>
    <line x1="16.4" y1="41" x2="47.6" y2="41"/>
  </g>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#2b3dff" stroke-width="2.6"/>
</svg>
